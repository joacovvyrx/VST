name: Build Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target VoxChoir_VST3
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "build/VoxChoir_artefacts/Release/VST3/VoxChoir.vst3" -DestinationPath "VoxChoir-Windows-VST3.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: VoxChoir-Windows-VST3
          path: VoxChoir-Windows-VST3.zip
        
